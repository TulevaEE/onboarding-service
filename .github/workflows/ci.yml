name: CI

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TERM: dumb
      SPRING_PROFILES_ACTIVE: ci,test
      GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew build --stacktrace --build-cache -DmaxParallelForks=2
      - name: Upload heap dump
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heapdump
          path: /tmp/heapdump.hprof
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/test-results
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: build/reports
          if-no-files-found: ignore
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload scorecard inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-inputs
          path: |
            build/metrics
            build/reports/pmd/main.xml
            build/reports/jacoco/test/jacocoTestReport.xml
            build/test-results/test
          if-no-files-found: error

  scorecard:
    name: scorecard
    needs: build
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-inputs
          path: build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the refactoring ratchets against the committed scorecard
        run: python3 scripts/scorecard.py

  pii-scan:
    name: pii-scan
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the scanner
        run: .githooks/pii-scan-test
      - name: Check added lines for personal data
        run: |
          git fetch --no-tags origin master
          BASE=$(git merge-base FETCH_HEAD HEAD)
          git diff "$BASE"..HEAD | .githooks/pii-scan

  migration-order:
    name: migration-order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the checker
        run: .githooks/migration-order-test
      - name: Check migration versions against master
        run: |
          git fetch --no-tags origin master
          MIGRATION_ORDER_BASE=FETCH_HEAD .githooks/migration-order HEAD

  emails-build:
    name: emails-build
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: emails/package-lock.json
      - run: npm ci
      - name: Build templates and run tests
        run: npm test

  appscript-test:
    name: appscript-test
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appscripts/seb-position-uploader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: appscripts/seb-position-uploader/package-lock.json
      - run: npm ci
      - run: npm test
