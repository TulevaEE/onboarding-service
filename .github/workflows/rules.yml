jobs:
  rules:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HAS_APP_KEY: ${{ secrets.RULES_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Find whether a watched file changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') ;;
            push) files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename') ;;
            *) files="" ;;
          esac
          if printf '%s\n' "$files" | grep -qxFf <(printf '%s' "$WATCHED" | sed '/^$/d'); then
            echo "watched=true" >> "$GITHUB_OUTPUT"
          else
            echo "No watched file changed; nothing to check"
          fi

      - name: Skip without the rules app
        if: steps.changed.outputs.watched == 'true' && (env.HAS_APP_KEY != 'true' || vars.RULES_APP_ID == '')
        run: echo "Rules app not configured; skipping"

      - name: Mint a token for the rules repository
        id: token
        if: steps.changed.outputs.watched == 'true' && env.HAS_APP_KEY == 'true' && vars.RULES_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RULES_APP_ID }}
          private-key: ${{ secrets.RULES_APP_PRIVATE_KEY }}
          owner: TulevaEE
          repositories: auto-generated-rules

      - name: Check the rules against this commit
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLISH: ${{ github.event_name == 'push' }}
          BRANCH: ${{ github.head_ref }}
          REPO: TulevaEE/auto-generated-rules
          READ_TOKEN: ${{ github.token }}
        run: |
          request="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "$BRANCH" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            BRANCH=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null) | .head.ref] | first // empty')
          fi
          ref=main
          if [ -n "$BRANCH" ] && gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            ref="$BRANCH"
          fi
          if [ "$ref" != main ] && [ "$PUBLISH" = true ]; then
            PUBLISH=false
            echo "::warning::The rules branch $ref is not merged into main yet; merging it there publishes the docs"
          fi
          echo "Checking against the rules branch $ref"
          gh api -X POST "repos/$REPO/actions/workflows/generate.yml/dispatches" \
            -f "ref=$ref" -f "inputs[onboarding_sha]=$SHA" -f "inputs[publish]=$PUBLISH" -f "inputs[request_id]=$request" >/dev/null
          run=""
          for _ in $(seq 1 30); do
            run=$(gh run list -R "$REPO" -w generate.yml -e workflow_dispatch -L 20 --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | endswith(\"$request\")) | .databaseId" | head -n1)
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then echo "The rules run did not start"; exit 1; fi
          if gh run watch "$run" -R "$REPO" --exit-status --interval 30 >/dev/null 2>&1; then
            echo "Rules match this commit"
          else
            echo "Rules do not match this commit; see the private repository"
            exit 1
          fi
